<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Nunito",ui-rounded,system-ui,sans-serif;background:#120f22;color:#fff;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:14px 10px 30px}
.hint{color:#cfc8e8;font-size:13px;text-align:center;margin-bottom:10px;max-width:420px}
.phone{width:360px;height:690px;border-radius:38px;overflow:hidden;position:relative;box-shadow:0 24px 70px #000a,0 0 0 8px #0d0b16;background:#000}
.home,.unit{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}

.home::-webkit-scrollbar,.unit::-webkit-scrollbar{display:none}

.unit.open{transform:none}
.tint{position:sticky;top:0;height:690px;margin-bottom:-690px;z-index:10;pointer-events:none}
.top{position:sticky;top:0;height:100px;margin-bottom:-100px;z-index:14;padding:14px 12px 0;background:linear-gradient(#150c2acc,#150c2a00);pointer-events:none}
.top .ey{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.top .ttl{font-weight:900;font-size:24px;line-height:1.05;text-shadow:0 2px 0 #0006;margin-bottom:7px}
.chips{display:flex;gap:6px}
.chip{display:flex;gap:4px;align-items:center;font-weight:900;font-size:12.5px;padding:5px 9px;border-radius:999px;white-space:nowrap;background:#ffffff2e;backdrop-filter:blur(6px);border:1px solid #ffffff33;color:#fff}
.world{position:relative;width:360px;height:2150px;overflow:hidden;
 background:linear-gradient(#4a3a8c 0,#d06a9c 90px,#ff9a70 190px,#ffcfa0 300px,#ffe6c4 350px,#9fb0e0 420px,#7f95d0 640px,#86cf62 770px,#5ec43c 900px,#52b83a 1060px,#8a6ab8 1200px,#5a4aa8 1320px,#4a45a6 1480px,#3f44a2 1650px,#3a3d9a 1900px,#32378c 2150px);
 --cloud:#ffd2c4;--mist:#ffbec880;--glow:.4}
.ly{position:absolute;left:0;top:0;width:360px;height:2150px;will-change:transform;pointer-events:none}
.ly svg{display:block}
.fog{position:absolute;left:-90px;width:540px;border-radius:50%;background:radial-gradient(closest-side,var(--mist),transparent);filter:blur(6px);animation:fg 55s ease-in-out infinite alternate;z-index:3;pointer-events:none}
@keyframes fg{to{transform:translateX(80px)}}
.gl{position:absolute;left:-60px;width:480px;z-index:3;pointer-events:none}
#lFar{filter:blur(1.3px)}#lMid{filter:blur(.7px)}
.cl{color:var(--cloud)}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(480px)}}
.cd{animation:drift linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@keyframes flap{50%{transform:scaleY(.35)}}
.fl{transform-box:fill-box;transform-origin:center;animation:flap 1.1s ease-in-out infinite}

@keyframes bal{50%{transform:translate(14px,-12px)}}

@keyframes flow{to{stroke-dashoffset:-44}}

@keyframes boat{50%{transform:translateY(3px) rotate(2deg)}}
.bt{animation:boat 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flk{0%,100%{opacity:1}45%{opacity:.5}}

@keyframes bur{0%{transform:scale(.1);opacity:1}100%{transform:scale(1.5);opacity:0}}
.bur{transform-box:fill-box;transform-origin:center;animation:bur 7s ease-out infinite}
@keyframes jet{to{stroke-dashoffset:-16}}

.mas{width:46px;height:44px;border-radius:50% 50% 46% 46%;background:#ff6b4a;position:relative;animation:bob 3.4s ease-in-out infinite;box-shadow:inset 0 -5px 8px #d94a2b66,0 6px 14px #3a1a6a44}
.mas i{position:absolute;top:13px;width:11px;height:13px;border-radius:50%;background:#fff}

.mas i:nth-child(1){left:9px}.mas i:nth-child(2){right:9px}

.dw{width:46px;margin:30px 0 40px;transform:scale(2.6)}
.rwc h2{font-size:34px;font-weight:900;text-shadow:0 4px 16px #0006;transform:scale(0)}

@keyframes pp{to{transform:scale(1)}}@keyframes fi{to{opacity:.95}}
.rwc button{margin-top:22px;border:0;border-radius:18px;padding:14px 38px;font:900 17px inherit;font-family:inherit;color:#fff;background:#14b8a6;box-shadow:0 8px 22px #0e8f8166;cursor:pointer;opacity:0}

.toast{position:absolute;left:50%;top:70px;transform:translate(-50%,-30px) scale(.8);opacity:0;z-index:40;background:#2a1a14;color:#ffd43b;font-weight:900;padding:10px 18px;border-radius:999px;transition:.35s cubic-bezier(.2,1.4,.4,1)}
.toast.on{transform:translate(-50%,0) scale(1);opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<script>
const H=2150;
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
let rnd=mul(11),TG={far:[],mid:[],near:[],gn:[]};
const ri=(a,b)=>a+rnd()*(b-a),pick=a=>a[rnd()*a.length|0],f1=n=>Math.round(n*10)/10;
const rr=(a,b)=>a+Math.random()*(b-a);
const add=(l,y,s)=>TG[l].push({y,s});
const U=(id,x,y,sc,col)=>`<use href="#${id}" transform="translate(${f1(x)} ${f1(y)}) scale(${Math.round(sc*100)/100})"${col?` style="color:${col}"`:''}/>`;
const outL=l=>TG[l].sort((a,b)=>a.y-b.y).map(o=>o.s).join("");
/* ---------- joylashuv ---------- */
const ITEMS=[
 {k:"u",t:"1-unit",s:"Begrüßung · Salomlashish"},
 {k:"n",st:"done",ic:"👋"},{k:"n",st:"done",ic:"🎧"},{k:"n",st:"done",ic:"✏️"},{k:"n",st:"done",ic:"⭐"},
 {k:"u",t:"2-unit",s:"Zahlen · Sonlar"},
 {k:"n",st:"cur",ic:"🔢"},{k:"n",st:"lock",ic:"🎧"},{k:"n",st:"lock",ic:"✏️"},{k:"n",st:"lock",ic:"🏆"},
 {k:"u",t:"3-unit",s:"Familie · Oila"},
 {k:"n",st:"lock",ic:"👨‍👩‍👧"},{k:"n",st:"lock",ic:"🎧"},
 {k:"u",t:"4-unit",s:"Uhrzeit · Soat (tez orada)"},
 {k:"n",st:"lock",ic:"⏰"},{k:"n",st:"lock",ic:"🎵"}
];
const OFF=[0,46,70,46,0,-46,-70,-46];
const NODES=[],SIGNS=[];let cy0=160,ni=0,ui=0;
ITEMS.forEach(it=>{if(it.k==="u"){SIGNS.push({top:cy0,u:++ui,t:it.t,s:it.s});cy0+=86}else{NODES.push({x:180+OFF[ni%8],y:cy0+50,st:it.st,ic:it.ic,u:ui});cy0+=100;ni++}});
const RP=[{x:180,y:150},{x:180,y:200},...NODES.map(n=>({x:n.x,y:n.y})),{x:180,y:1800},{x:180,y:1870}];
function roadX(y){for(let i=0;i<RP.length-1;i++){const a=RP[i],b=RP[i+1];if(y>=a.y&&y<=b.y)return a.x+(b.x-a.x)*(y-a.y)/(b.y-a.y)}return 180}
const free=(x,y,m)=>Math.abs(x-roadX(y))>m;
const ok=(m,x,y)=>typeof m==="function"?m(x,y):(!m||free(x,y,m));
function smooth(p){let d=`M${p[0].x} ${p[0].y}`;for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;d+=`C${f1(p1.x+(p2.x-p0.x)/6)} ${f1(p1.y+(p2.y-p0.y)/6)} ${f1(p2.x-(p3.x-p1.x)/6)} ${f1(p2.y-(p3.y-p1.y)/6)} ${p2.x} ${p2.y}`}return d}

function scat(l,id,n,x0,x1,y0,y1,s0,s1,cols,m){for(let i=0,k=0;i<n&&k<n*8;k++){const x=ri(x0,x1),y=ri(y0,y1);if(!ok(m,x,y))continue;i++;add(l,y,U(id,x,y,ri(s0,s1),pick(cols)))}}
function band(l,y,h,fill,amp,ph,fur){let d=`M-10 ${y}`;for(let x=-10;x<=370;x+=15)d+=`L${x} ${f1(y+Math.sin(x/37+ph)*amp+Math.sin(x/13+ph*2)*amp*.3)}`;d+=`L370 ${y+h}L-10 ${y+h}Z`;let s=`<path d="${d}" style="fill:${fill}"/>`;if(fur)for(let k=1;k<4;k++){let e=`M-10 ${y+k*h/4}`;for(let x=-10;x<=370;x+=15)e+=`L${x} ${f1(y+k*h/4+Math.sin(x/37+ph)*amp*.8)}`;s+=`<path d="${e}" fill="none" stroke="#000" stroke-opacity=".08" stroke-width="1.5"/>`}add(l,y-.5,s)}
function row(l,y,step,s0,s1,cols,snowy,m){for(let x=-10;x<370;x+=step){const xx=x+ri(-step/2,step/2),yy=y+ri(-5,5);if(!ok(m,xx,yy))continue;add(l,yy,U(snowy?"pineS":"pine",xx,yy,ri(s0,s1),pick(cols)))}}
function ridge(pts,base,fill,snow,smax){let d=`M${pts[0][0]} ${base}`;pts.forEach(p=>d+=`L${p[0]} ${p[1]}`);d+=`L${pts[pts.length-1][0]} ${base}Z`;let s=`<path d="${d}" style="fill:${fill}"/>`;for(let i=1;i<pts.length-1;i++){const[x,y]=pts[i],a=pts[i-1],b=pts[i+1];if(y<a[1]&&y<b[1]&&y<smax){const lx=x+(a[0]-x)*.42,ly=y+(a[1]-y)*.42,rx=x+(b[0]-x)*.42,ry=y+(b[1]-y)*.42;s+=`<path d="M${x} ${y}L${rx} ${ry}L${f1((rx+x)/2+3)} ${ry-5}L${x+1} ${ry+10}L${f1((lx+x)/2-3)} ${ly-5}L${lx} ${ly}Z" style="fill:${snow}"/>`}}return s}
function cloud(l,x,y,s,col,dur,del){add(l,y,`<g class="cd" style="animation-duration:${dur*2}s;animation-delay:-${del}s"><g transform="translate(${x} ${y}) scale(${s})"><use href="#cloud" style="color:${col}"/></g></g>`)}

function win(x,y,w,h){return`<rect class="${rnd()<.3?"wn":""}" x="${x}" y="${y}" width="${w}" height="${h}" fill="#ffd66b"/>`}
