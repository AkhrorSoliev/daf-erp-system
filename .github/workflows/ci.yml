name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (typecheck + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # `prisma generate` reads DATABASE_URL even though it never opens a
      # connection — a placeholder is enough. Tests mock PrismaService.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      # Type-checks src/ INCLUDING *.spec.ts, which `npm run build` cannot:
      # its tsconfig excludes specs, and `ts-jest` runs transpile-only, so a
      # spec could drift from the signature it mocks and stay green.
      #
      # AFTER the build on purpose — `npm run build` is what runs
      # `prisma generate`, and without it `@prisma/client` has no types for
      # this step to check against. There is no postinstall hook.
      - run: npm run typecheck
      - run: npm test

  client:
    name: Client (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
