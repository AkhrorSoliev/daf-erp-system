name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (typecheck + lint + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # `prisma generate` reads DATABASE_URL even though it never opens a
      # connection — a placeholder is enough. Tests mock PrismaService.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      # At least 16 chars — `config/env.validation.ts` refuses to boot below
      # that, and this value has to satisfy the same rule production does.
      JWT_SECRET: ci-test-secret-value
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      # Type-checks src/ INCLUDING *.spec.ts, which `npm run build` cannot:
      # its tsconfig excludes specs, and `ts-jest` runs transpile-only, so a
      # spec could drift from the signature it mocks and stay green.
      #
      # AFTER the build on purpose — `npm run build` is what runs
      # `prisma generate`, and without it `@prisma/client` has no types for
      # this step to check against. There is no postinstall hook.
      - run: npm run typecheck
      # ESLint gates on ERRORS only; warnings are reported and do not fail the
      # build. That split is deliberate: the `no-unsafe-*` family fires on
      # every Prisma JSON field and raw query in this codebase — thousands of
      # them, none a defect — so gating on warnings would mean turning the
      # rules off, and turning them off is how you stop seeing the one that
      # matters. Errors are the set that has been triaged to zero.
      - run: npx eslint src
      - run: npm test

  client:
    name: Client (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src
      # The client has had a vitest suite for a while and CI never ran it —
      # `branch-header`, `branch-cache` and `branch-scoped-stores` all encode
      # branch-isolation rules, and a break in any of them would have reached
      # main unnoticed.
      - run: npm test
      - run: npm run build

  student-app:
    name: Student app (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: student-app/package-lock.json
      # npm 10 here is what EAS installs SDK 54 builds with. npm 11 can write
      # a lockfile npm 10 rejects — it drops optional peer entries (`yaml`,
      # `@emnapi/*`) that npm 10 requires; that drift broke an EAS build in
      # June. If this fails with "Missing: … from lock file", rewrite the
      # lockfile with `npx npm@10 install`.
      - run: npm ci
      # The only check on the uz/de dictionaries: `de.ts` is typed `Dict`, the
      # shape of `uz.ts`, so a missing or mistyped German key fails here — the
      # app has no test suite. Route strings are NOT checked: the typed-routes
      # file `.expo/types/router.d.ts` comes from `expo start` and is
      # gitignored, so `Href` is a plain string in CI.
      - run: npx tsc --noEmit
      # Lints `src/` and fails on errors only; warnings are printed and pass.
      - run: npx expo lint
