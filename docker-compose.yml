services:
  postgres:
    image: postgres:16-alpine
    container_name: daf-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: daf_erp
      POSTGRES_USER: daf_user
      POSTGRES_PASSWORD: daf_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: daf-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
