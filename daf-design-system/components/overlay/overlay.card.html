<!-- @dsCard group="Components" viewport="700x400" name="Overlay · Dialog & BottomSheet" subtitle="Centered modals (confirm/alert/celebrate) + bottom sheet — tap to open" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>body{margin:0;padding:0;background:var(--surface-app);font-family:var(--font-ui)}
  #root{position:relative;width:100%;height:400px;overflow:hidden}
  .pad{padding:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
  .lbl{width:100%;font-weight:800;font-size:11px;color:var(--ink-400);letter-spacing:.06em;text-transform:uppercase;margin-bottom:-2px}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Dialog, BottomSheet, SheetAction, Button } = window.LumioDesignSystem_f2f824;
const F=(n)=><i className={`ph-fill ph-${n}`}/>;
function Demo(){
  const [d,setD]=React.useState(null); // 'confirm'|'alert'|'celebrate'|'sheet'
  return (<div>
    <div className="pad">
      <span className="lbl">Tap to preview</span>
      <Button variant="secondary" onClick={()=>setD('confirm')}>Confirm dialog</Button>
      <Button variant="secondary" onClick={()=>setD('alert')}>Alert dialog</Button>
      <Button variant="amber" onClick={()=>setD('celebrate')}>Celebrate</Button>
      <Button variant="secondary" onClick={()=>setD('sheet')}>Bottom sheet</Button>
    </div>

    {d==='confirm'&&<Dialog variant="confirm" icon={F('arrow-counter-clockwise')} title="Starterga qaytasizmi?"
      onClose={()=>setD(null)}
      actions={<><Button variant="primary" block onClick={()=>setD(null)}>Ha, qaytish</Button>
      <Button variant="ghost" block onClick={()=>setD(null)}>Bekor qilish</Button></>}>
      Siz Starter darslarining boshiga qaytasiz.</Dialog>}

    {d==='alert'&&<Dialog variant="alert" icon={F('heart-break')} title="Darsni tark etasizmi?"
      onClose={()=>setD(null)}
      actions={<><Button variant="primary" block onClick={()=>setD(null)}>Ha, chiqish</Button>
      <Button variant="ghost" block onClick={()=>setD(null)}>Davom etish</Button></>}>
      Joriy darsdagi yutuqlaringiz saqlanmaydi.</Dialog>}

    {d==='celebrate'&&<Dialog variant="celebrate" icon={F('trophy')} title="Tabriklaymiz!"
      onClose={()=>setD(null)}
      actions={<Button variant="amber" block onClick={()=>setD(null)}>Ajoyib!</Button>}>
      Siz 5 kunlik seriyaga yetdingiz va +50 XP qo‘shildi.</Dialog>}

    {d==='sheet'&&<BottomSheet title="Til" onClose={()=>setD(null)}>
      <SheetAction icon={F('flag')} label="O‘zbekcha" onClick={()=>setD(null)}/>
      <SheetAction icon={F('flag')} label="English (UK)" onClick={()=>setD(null)}/>
      <SheetAction icon={F('prohibit')} tone="danger" label="Bekor qilish" onClick={()=>setD(null)}/>
    </BottomSheet>}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
