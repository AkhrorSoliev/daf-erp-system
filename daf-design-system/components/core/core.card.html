<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>body{margin:0;padding:24px;background:var(--surface-app);font-family:var(--font-ui)}
  .grp{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  .lbl{font-weight:800;font-size:11px;color:var(--ink-400);letter-spacing:.06em;text-transform:uppercase;width:100%;margin-bottom:-4px}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, IconButton, Card, Badge, Chip, Avatar } = window.LumioDesignSystem_f2f824;
const I = ({n,w='bold'}) => <i className={`ph-${w} ph-${n}`} />;
function Demo(){
  const [chip,setChip]=React.useState('all');
  return (<div>
    <div className="grp"><span className="lbl">Buttons</span>
      <Button variant="primary">Ha, qaytish</Button>
      <Button variant="secondary" iconBefore={<I n="play" w="fill"/>}>Davom etish</Button>
      <Button variant="amber" size="sm">+10 XP</Button>
      <Button variant="teal" size="sm">Tekshirish</Button>
      <Button variant="ghost">Keyinroq</Button>
      <Button variant="primary" disabled>O‘chirilgan</Button>
    </div>
    <div className="grp"><span className="lbl">Icon buttons · Badges · Chips</span>
      <IconButton variant="white"><I n="arrow-up-right"/></IconButton>
      <IconButton variant="primary"><I n="house" w="fill"/></IconButton>
      <IconButton variant="soft"><I n="bell" w="fill"/></IconButton>
      <Badge color="amber">[noun]</Badge>
      <Badge color="success" soft={false}>Tugallandi</Badge>
      <Badge color="coral">Yangi</Badge>
      <Chip selected={chip==='all'} onClick={()=>setChip('all')}>Hammasi</Chip>
      <Chip selected={chip==='new'} onClick={()=>setChip('new')} iconBefore={<I n="star" w="fill"/>}>Yangi</Chip>
      <Avatar name="Jasur K" size={44} ring badge="7"/>
    </div>
    <div className="grp"><span className="lbl">Card</span>
      <Card clay tone="neutral" style={{flex:1,minWidth:200}}>
        <div style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:18,color:'var(--ink-900)'}}>Bugungi maqsad</div>
        <div style={{fontWeight:600,fontSize:14,color:'var(--ink-500)',marginTop:4}}>3 dars · 10 daqiqa</div>
      </Card>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
