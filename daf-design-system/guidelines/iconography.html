<!-- @dsCard group="Brand" viewport="700x280" name="Iconography · Phosphor" subtitle="Three weights = state; core glyph set" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  body{margin:0;padding:22px;background:var(--surface-card);font-family:var(--font-ui)}
  .lbl{font-weight:800;font-size:11px;color:var(--ink-400);letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px}
  .weights{display:flex;gap:10px;margin-bottom:20px}
  .w{flex:1;background:var(--bg-tint);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;text-align:center}
  .w i{font-size:34px;color:var(--ink-900)}
  .w .n{margin-top:8px;font-weight:800;font-size:12px;color:var(--ink-700)}
  .w .u{font-weight:700;font-size:11px;color:var(--ink-400)}
  .w.active{background:var(--coral-50);border-color:var(--coral-200)}
  .w.active i{color:var(--coral-500)}
  .set{display:flex;flex-wrap:wrap;gap:14px}
  .g{display:flex;flex-direction:column;align-items:center;gap:6px;width:62px}
  .g .tile{width:48px;height:48px;border-radius:var(--r-md);background:var(--bg-app);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--ink-800)}
  .g .c{font-weight:700;font-size:10px;color:var(--ink-400)}
</style></head>
<body>
  <div class="lbl">Weight = state</div>
  <div class="weights">
    <div class="w"><i class="ph ph-house"></i><div class="n">ph · regular</div><div class="u">inactive</div></div>
    <div class="w"><i class="ph-bold ph-house"></i><div class="n">ph-bold</div><div class="u">decorative</div></div>
    <div class="w active"><i class="ph-fill ph-house"></i><div class="n">ph-fill</div><div class="u">active / emphasis</div></div>
  </div>
  <div class="lbl">Core glyphs</div>
  <div class="set">
    <div class="g"><div class="tile"><i class="ph-fill ph-house"></i></div><div class="c">house</div></div>
    <div class="g"><div class="tile"><i class="ph-fill ph-path"></i></div><div class="c">path</div></div>
    <div class="g"><div class="tile"><i class="ph-fill ph-books"></i></div><div class="c">books</div></div>
    <div class="g"><div class="tile"><i class="ph-fill ph-squares-four"></i></div><div class="c">squares</div></div>
    <div class="g"><div class="tile"><i class="ph-fill ph-lightning" style="color:var(--amber-500)"></i></div><div class="c">lightning</div></div>
    <div class="g"><div class="tile"><i class="ph-fill ph-fire" style="color:var(--coral-500)"></i></div><div class="c">fire</div></div>
    <div class="g"><div class="tile"><i class="ph-fill ph-diamond" style="color:var(--teal-500)"></i></div><div class="c">diamond</div></div>
    <div class="g"><div class="tile"><i class="ph-fill ph-trophy" style="color:var(--amber-500)"></i></div><div class="c">trophy</div></div>
    <div class="g"><div class="tile"><i class="ph-fill ph-chat-circle"></i></div><div class="c">chat</div></div>
    <div class="g"><div class="tile"><i class="ph-fill ph-paper-plane-right" style="color:var(--coral-500)"></i></div><div class="c">send</div></div>
    <div class="g"><div class="tile"><i class="ph-fill ph-lock-simple"></i></div><div class="c">lock</div></div>
    <div class="g"><div class="tile"><i class="ph-bold ph-arrow-up-right"></i></div><div class="c">open</div></div>
  </div>
</body></html>
