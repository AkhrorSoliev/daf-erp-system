<!-- @dsCard group="Brand" viewport="700x300" name="Sound Effects" subtitle="Procedural Web Audio cues — tap to play" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  body{margin:0;padding:22px;background:var(--surface-card);font-family:var(--font-ui)}
  .hint{font-weight:700;font-size:12px;color:var(--ink-400);margin:0 0 14px}
  .grid{display:flex;flex-wrap:wrap;gap:10px}
  .key{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border:none;border-radius:var(--r-pill);
    background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);cursor:pointer;
    font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--ink-900);transition:transform .1s var(--ease-out)}
  .key:active{transform:translateY(2px)}
  .key i{font-size:18px;color:var(--coral-500)}
  .toggle{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--ink-600)}
  .bar{display:flex;align-items:center;margin-bottom:14px}
</style></head>
<body>
  <div class="bar">
    <p class="hint" style="margin:0">Tap a cue to hear it. Cues are synthesized live — no audio files.</p>
    <label class="toggle"><input type="checkbox" id="en" checked> Ovoz effektlari</label>
  </div>
  <div class="grid" id="grid"></div>
  <script src="../assets/sound.js"></script>
  <script>
    var cues=[['tap','hand-tap'],['select','cursor-click'],['toggle','toggle-left'],['correct','check-circle'],['wrong','x-circle'],['coin','coin'],['xp','lightning'],['streak','fire'],['levelup','trophy'],['win','confetti'],['notify','bell'],['message','chat-circle'],['sheet','tray'],['locked','lock-simple']];
    var g=document.getElementById('grid');
    cues.forEach(function(c){var b=document.createElement('button');b.className='key';
      b.innerHTML='<i class="ph-fill ph-'+c[1]+'"></i>'+c[0];
      b.onclick=function(){LumioSound.unlock();LumioSound.play(c[0]);};g.appendChild(b);});
    var en=document.getElementById('en');
    en.checked=LumioSound.enabled();
    en.onchange=function(){LumioSound.setEnabled(en.checked);if(en.checked)LumioSound.play('toggle');};
  </script>
</body></html>
