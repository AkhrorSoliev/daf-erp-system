<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="8pt base, roomy & touch-first" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--surface-card);font-family:var(--font-ui)}
  .row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;align-items:center;gap:6px}
  .bar{background:var(--coral-300);border-radius:4px}
  .n{font-weight:800;font-size:11px;color:var(--ink-700)}
  .v{font-weight:700;font-size:10px;color:var(--ink-400)}
</style></head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="width:4px;height:4px"></div><div class="n">s-1</div><div class="v">4</div></div>
    <div class="col"><div class="bar" style="width:8px;height:8px"></div><div class="n">s-2</div><div class="v">8</div></div>
    <div class="col"><div class="bar" style="width:12px;height:12px"></div><div class="n">s-3</div><div class="v">12</div></div>
    <div class="col"><div class="bar" style="width:16px;height:16px"></div><div class="n">s-4</div><div class="v">16</div></div>
    <div class="col"><div class="bar" style="width:20px;height:20px"></div><div class="n">s-5</div><div class="v">20</div></div>
    <div class="col"><div class="bar" style="width:24px;height:24px"></div><div class="n">s-6</div><div class="v">24</div></div>
    <div class="col"><div class="bar" style="width:32px;height:32px"></div><div class="n">s-8</div><div class="v">32</div></div>
    <div class="col"><div class="bar" style="width:48px;height:48px"></div><div class="n">s-12</div><div class="v">48</div></div>
  </div>
</body></html>
