<!-- @dsCard group="Colors" viewport="700x190" name="Accents" subtitle="Amber, Teal, Grape, Sky" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:22px;background:var(--surface-app);font-family:var(--font-ui)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .sw{width:120px;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-xs);background:#fff}
  .chip{height:64px}
  .meta{padding:8px 10px}
  .name{font-weight:800;font-size:12px;color:var(--ink-900)}
  .hex{font-size:11px;color:var(--ink-500);font-weight:700}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--amber-500)"></div><div class="meta"><div class="name">amber-500</div><div class="hex">#FFB02E · XP/coins</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--teal-500)"></div><div class="meta"><div class="name">teal-500</div><div class="hex">#14B8AC · success pop</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--grape-500)"></div><div class="meta"><div class="name">grape-500</div><div class="hex">#8B5CF6 · utility</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--sky-500)"></div><div class="meta"><div class="name">sky-500</div><div class="hex">#2E97FF · cool</div></div></div>
  </div>
</body></html>
