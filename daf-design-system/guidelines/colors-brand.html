<!-- @dsCard group="Colors" viewport="700x190" name="Brand · Coral" subtitle="Primary action color + tints" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:22px;background:var(--surface-app);font-family:var(--font-ui)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .sw{width:96px;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-xs);background:#fff}
  .chip{height:70px}
  .meta{padding:8px 10px}
  .name{font-weight:800;font-size:12px;color:var(--ink-900)}
  .hex{font-size:11px;color:var(--ink-500);font-weight:700;letter-spacing:.02em}
  .star{outline:3px solid var(--ink-900);outline-offset:2px;border-radius:var(--r-md)}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--coral-100)"></div><div class="meta"><div class="name">coral-100</div><div class="hex">#FFE1D8</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--coral-300)"></div><div class="meta"><div class="name">coral-300</div><div class="hex">#FFA48A</div></div></div>
    <div class="sw star"><div class="chip" style="background:var(--coral-500)"></div><div class="meta"><div class="name">coral-500 ★</div><div class="hex">#FF6B4A</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--coral-600)"></div><div class="meta"><div class="name">coral-600</div><div class="hex">#F04E2C</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--coral-700)"></div><div class="meta"><div class="name">coral-700</div><div class="hex">#C83D20</div></div></div>
  </div>
</body></html>
